<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2f" />
      <stop offset="55%" stop-color="#0d2847" />
      <stop offset="100%" stop-color="#051322" />
    </linearGradient>

    <!-- Sun Radial Gradient -->
    <radialGradient id="sunGrad" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Mangrove Leaf Gradient -->
    <linearGradient id="mangroveGrad" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Ocean Wave Front Gradient -->
    <linearGradient id="waveFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Ocean Wave Deep Gradient -->
    <linearGradient id="waveDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Gold Accent Ring -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge / Squircle with Golden Border -->
  <rect x="5" y="5" width="118" height="118" rx="32" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="3.5" />

  <!-- Ambient Glow for Rising Sun -->
  <circle cx="64" cy="52" r="30" fill="#F59E0B" opacity="0.18" filter="url(#softGlow)" />

  <!-- Golden Sun -->
  <circle cx="64" cy="52" r="22" fill="url(#sunGrad)" />

  <!-- Sun Rays (Gentle Compass Marks) -->
  <path d="M 64 22 L 66 28 L 64 26 L 62 28 Z" fill="#FDE047" opacity="0.9" />
  <path d="M 94 52 L 88 54 L 90 52 L 88 50 Z" fill="#FDE047" opacity="0.9" />
  <path d="M 34 52 L 40 50 L 38 52 L 40 54 Z" fill="#FDE047" opacity="0.9" />

  <!-- Mangrove Canopy & Leaf (Graceful curve forming the upper sweep of S) -->
  <path d="M 32 94 C 30 76, 36 50, 52 38 C 66 28, 86 34, 88 44 C 89 49, 82 52, 74 50 C 62 47, 50 56, 46 72 C 43 82, 38 92, 32 94 Z" fill="url(#mangroveGrad)" />

  <!-- Leaf Vein Highlights -->
  <path d="M 44 68 C 50 54, 64 42, 84 41" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 54 55 C 58 50, 66 48, 70 47" stroke="#A7F3D0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Back Deep Ocean Wave -->
  <path d="M 16 88 C 30 80, 48 84, 62 90 C 76 96, 94 96, 112 84 L 112 106 C 96 114, 76 116, 60 112 C 44 108, 28 110, 16 102 Z" fill="url(#waveDeep)" />

  <!-- Front Dynamic Wave Crest (Lower sweep of S) -->
  <path d="M 10 96 C 26 88, 46 90, 60 97 C 76 104, 94 102, 114 90 C 114 96, 112 108, 102 114 C 88 122, 40 122, 24 114 C 16 108, 12 102, 10 96 Z" fill="url(#waveFront)" />

  <!-- Wave Foam Accent -->
  <path d="M 50 96 C 62 91, 78 93, 92 89 C 86 93, 72 95, 60 94 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Golden 4-point Star Beacon (ADWI Excellence Honor) -->
  <g transform="translate(95, 26)">
    <path d="M 0 -8 Q 1.2 -1.2 8 0 Q 1.2 1.2 0 8 Q -1.2 1.2 -8 0 Q -1.2 -1.2 0 -8 Z" fill="#FDE047" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>
</svg>